name: Demo Portfolio CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'demo-portfolio/**'
      - '.github/workflows/demo-portfolio-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'

concurrency:
  group: demo-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify Demo Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install demo portfolio dependencies
        run: |
          cd demo-portfolio
          npm ci

      - name: 4. Build demo portfolio (Vite & Tailwind)
        run: |
          cd demo-portfolio
          npm run build

      - name: 5. Verify build artifacts exist
        run: |
          test -f demo-portfolio/dist/index.html || { echo "Build artifact index.html missing"; exit 1; }
          echo "Verified demo-portfolio/dist/index.html exists and is ready for Render Static Site publishing."

      - name: 6. Trigger Render Static Site Deploy Hook (Optional)
        if: success() && env.DEMO_PORTFOLIO_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render Demo Portfolio deployment hook..."
          curl -f -s -X POST "${DEMO_PORTFOLIO_DEPLOY_HOOK_URL}" || echo "Deploy hook executed with warnings"
        env:
          DEMO_PORTFOLIO_DEPLOY_HOOK_URL: ${{ secrets.DEMO_PORTFOLIO_DEPLOY_HOOK_URL }}

      - name: 7. Report Workflow Result to Step Summary
        if: always()
        run: |
          echo "### 🎨 DeployFlow Demo Portfolio — Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Output Verified**: \`demo-portfolio/dist/\`" >> $GITHUB_STEP_SUMMARY
