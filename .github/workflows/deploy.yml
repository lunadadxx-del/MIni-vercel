name: DeployFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'demo-portfolio/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: false
        default: 'production'

concurrency:
  group: deployflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-verify:
    name: Build, Test & Containerize
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: 4. Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api' }}

      - name: 5. Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: 6. Run backend automated tests
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          ADMIN_SECRET: test-secret-key

      - name: 7. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 8. Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            deployflow-backend:latest
            deployflow-backend:${{ github.sha }}

      - name: 9. Trigger Render Deploy (Optional Deploy Hook)
        if: success() && env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render deployment webhook..."
          curl -f -s -X POST "${RENDER_DEPLOY_HOOK_URL}" || echo "Deploy hook triggered with warnings"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: 10. Report Workflow Result to Step Summary
        if: always()
        run: |
          echo "### 🚀 DeployFlow Pipeline Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image Verified**: \`deployflow-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
